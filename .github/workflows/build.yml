name: Build
on:
  push:
    branches:
      - master
      - 'branch-*'
      - 'dogfood-*'
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write  # Vault OIDC
  contents: write  # Repository access

jobs:
  build:
    name: Build
    runs-on: github-ubuntu-latest-s
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.8
      - uses: SonarSource/ci-github-actions/build-maven@62463382a24f2004ffa20adbe9985f6459e031e6 # v2 (1.2.1)
        with:
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          deploy-pull-request: true
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-reports
          path: '**/target/surefire-reports/**/*'
          if-no-files-found: ignore
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: '**/target/surefire-reports/**/*.xml'
          if-no-files-found: ignore

  promote:
    needs:
      - build
    runs-on: github-ubuntu-latest-s
    name: Promote
    steps:
      - *checkout
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          cache_save: false
          version: 2026.10.8
      - uses: SonarSource/ci-github-actions/get-build-number@62463382a24f2004ffa20adbe9985f6459e031e6 # v2 (1.2.1)
      - uses: SonarSource/ci-github-actions/promote@62463382a24f2004ffa20adbe9985f6459e031e6 # v2 (1.2.1)
        with:
          promote-pull-request: true
